name: Temp Whisper Small Model Transfer

on:
  push:
    branches:
      - temp/audio-transcription-20260824
    paths:
      - .github/workflows/temp-whisper-small-model.yml

jobs:
  model:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download multilingual Whisper small q5_1
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o ggml-small-q5_1.bin \
            https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-small-q5_1.bin
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin" | sha256sum -c -
          ls -lh ggml-small-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: temp-whisper-small-q5
          path: ggml-small-q5_1.bin
          retention-days: 1
          compression-level: 0
